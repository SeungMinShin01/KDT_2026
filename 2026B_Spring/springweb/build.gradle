plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'springweb'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// main 메소드를 가진 클래스가 여러 개(SpringwebApplication, AppStart)라서
// bootRun 으로 실행할 클래스를 직접 지정해준다. day03을 실행할 땐 이 줄을 바꾸면 된다.
springBoot {
	mainClass = 'day03.exam.AppStart'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 3. 롬북
	compileOnly 'org.projectlombok:lombok'
  	annotationProcessor 'org.projectlombok:lombok'

	// 4. JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// 5. XML <-> 객체 변환 (XmlMapper). Spring Boot 4 는 Jackson 3 이라 tools.jackson 쪽이다.
	implementation 'tools.jackson.dataformat:jackson-dataformat-xml'
  	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
  	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'com.opencsv:opencsv:5.12.0'

	implementation 'org.springframework.security:spring-security-crypto'

	// 6. 레디스 연동
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// 7. JWT 토큰 (jjwt) : api 는 컴파일용, impl/jackson 은 실행시에만 필요
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// 8. Jackson 2 (com.fasterxml.jackson) : Spring Boot 4 기본은 Jackson 3(tools.jackson) 이라
	//    수업에서 쓰는 com.fasterxml.jackson.databind.ObjectMapper 를 위해 따로 추가한다.
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// 9. 웹소켓 (STOMP 메시지 브로커 포함)
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
}

tasks.named('test') {
	useJUnitPlatform()
}
